name: Build 8 West FDMN Database

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Check PHP files
        run: for f in backend/*.php backend/api/*.php; do php -l "$f"; done
      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/FDMN8West.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FDMN8West-apk
          path: app/build/outputs/apk/debug/FDMN8West.apk
      - uses: actions/upload-artifact@v4
        with:
          name: server-files
          path: backend/
          include-hidden-files: true
